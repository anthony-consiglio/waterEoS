[build-system]
requires = ["setuptools>=64", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "waterEoS"
version = "0.5.0"
description = "Equations of state for supercooled water"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.9"
authors = [{ name = "Anthony Consiglio", email = "aconsiglio4@berkeley.edu" }]
keywords = ["water", "equation of state", "supercooled", "thermodynamics", "two-state"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
# SeaFreeze + lbftd + mlbspline are only needed for the one-off
# data/extract_seafreeze_splines.py spline extractor and for the
# cross-validation tests (tests/test_rust_seafreeze.py). At runtime the
# native watereos_rs evaluator covers all SeaFreeze functionality the
# package needs.
dev = ["jax>=0.4.30", "pytest", "SeaFreeze>=0.9"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "plotly>=5.18",
    "gunicorn>=21.2",
    "iapws>=0.4",
]
tv = ["iapws>=0.4"]
rust = ["setuptools-rust>=1.9"]

[project.urls]
Homepage = "https://github.com/anthony-consiglio/waterEoS"
Issues = "https://github.com/anthony-consiglio/waterEoS/issues"

[tool.setuptools.packages.find]
include = ["watereos*", "watereos_ad*", "duska_eos*", "caupin_eos*", "holten_eos*", "grenke_eos*", "singh_viscosity*", "shi_tanaka_eos*", "shi_tanaka_transport*"]
exclude = ["tests*", "examples*", "watereos_api*"]

[tool.setuptools.package-data]
"watereos" = ["data/*.json", "data/*.bin"]

[[tool.setuptools-rust.ext-modules]]
target = "watereos_rs"
binding = "PyO3"
optional = true

[tool.maturin]
python-packages = [
    "watereos", "watereos_ad",
    "caupin_eos", "duska_eos", "holten_eos", "grenke_eos",
    "singh_viscosity",
    "shi_tanaka_eos", "shi_tanaka_transport",
]
